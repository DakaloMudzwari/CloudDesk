<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudDesk | Reset Password</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="login-container" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem;">
        <div class="glass-card" style="width: 100%; max-width: 450px;">
            <div style="text-align: center; margin-bottom: 2.5rem;">
                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Reset Password</h1>
                <p style="color: var(--text-muted);">Enter the code and your new password</p>
            </div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="user@example.com" required readonly>
                </div>
                <div class="form-group">
                    <label for="token">Reset Code</label>
                    <input type="text" id="token" class="form-input" placeholder="123456" required maxlength="6">
                </div>
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Reset Password <i class="fas fa-check"></i>
                </button>
            </form>

            <div style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.875rem;">
                Remembered your password? <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign In</a>
            </div>
        </div>
    </main>

    <script src="assets/js/app.js" type="module"></script>
    <script type="module">
        import { app } from './assets/js/app.js';

        const emailInput = document.getElementById('email');
        emailInput.value = localStorage.getItem('cd_reset_email') || '';

        const form = document.getElementById('resetForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const token = document.getElementById('token').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('api/reset-password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, token, password })
                });
                const result = await response.json();

                if (result.success) {
                    app.showToast(result.message, 'success');
                    localStorage.removeItem('cd_reset_email');
                    setTimeout(() => window.location.href = 'index.html', 2000);
                } else {
                    app.showToast(result.error || 'Failed to reset password', 'danger');
                }
            } catch (err) {
                app.showToast('Failed to connect to server', 'danger');
            }
        });
    </script>
</body>
</html>
