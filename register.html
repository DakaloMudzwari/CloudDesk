<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudDesk | Register</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="login-container" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem;">
        <div class="glass-card" style="width: 100%; max-width: 500px;">
            <div style="text-align: center; margin-bottom: 2.5rem;">
                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Create Account</h1>
                <p style="color: var(--text-muted);">Join the CloudDesk support ecosystem</p>
            </div>

            <form id="registerForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" class="form-input" placeholder="Jane" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" class="form-input" placeholder="Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="jane@company.com" required>
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" class="form-input">
                        <option>Marketing</option>
                        <option>Finance</option>
                        <option>Operations</option>
                        <option>HR</option>
                        <option>Sales</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="role">Account Type</label>
                    <select id="role" class="form-input">
                        <option value="user">Standard User</option>
                        <option value="technician">Support Technician</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Create Account <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <div style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.875rem;">
                Already have an account? <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign in</a>
            </div>
        </div>
    </main>

    <script src="assets/js/app.js" type="module"></script>
    <script type="module">
        import { app } from './assets/js/app.js';
        
        const registerForm = document.getElementById('registerForm');
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                department: document.getElementById('department').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };

            try {
                const response = await fetch('api/register.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    app.showToast('Registration successful! Please login.', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    app.showToast(result.error || 'Registration failed', 'danger');
                }
            } catch (err) {
                app.showToast('Failed to connect to server', 'danger');
                console.error(err);
            }
        });
    </script>
</body>
</html>
