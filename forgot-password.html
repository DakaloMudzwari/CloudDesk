<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudDesk | Forgot Password</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="login-container" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem;">
        <div class="glass-card" style="width: 100%; max-width: 450px;">
            <div style="text-align: center; margin-bottom: 2.5rem;">
                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Forgot Password</h1>
                <p style="color: var(--text-muted);">Enter your email to receive a reset code</p>
            </div>

            <form id="forgotForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="user@example.com" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Send Reset Code <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.875rem;">
                Remembered your password? <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign In</a>
            </div>
        </div>
    </main>

    <script src="assets/js/app.js" type="module"></script>
    <script type="module">
        import { app } from './assets/js/app.js';

        const form = document.getElementById('forgotForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            try {
                const response = await fetch('api/forgot-password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const result = await response.json();

                if (result.success) {
                    app.showToast(result.message + (result.token ? ` (Mock Token: ${result.token})` : ''), 'success');
                    localStorage.setItem('cd_reset_email', email);
                    setTimeout(() => window.location.href = 'reset-password.html', 2000);
                } else {
                    app.showToast(result.error || 'Failed to send code', 'danger');
                }
            } catch (err) {
                app.showToast('Failed to connect to server', 'danger');
            }
        });
    </script>
</body>
</html>
