<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudDesk | User Management</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="app-container">
        <aside class="sidebar">
            <a href="#" onclick="app.goHome(); return false;"
                style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 3rem; cursor: pointer;">
                <div
                    style="width: 40px; height: 40px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-cloud"></i>
                </div>
                <span style="font-weight: 700; font-size: 1.25rem;">CloudDesk Admin</span>
            </a>
            <nav style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
                <a href="admin-dashboard.html" class="btn"
                    style="justify-content: flex-start; color: var(--text-muted);">
                    <i class="fas fa-chart-line"></i> <span>Overview</span>
                </a>
                <a href="users.html" class="btn"
                    style="justify-content: flex-start; background: rgba(99, 102, 241, 0.1); color: var(--primary);">
                    <i class="fas fa-users-cog"></i> <span>User Management</span>
                </a>
                <a href="reports.html" class="btn" style="justify-content: flex-start; color: var(--text-muted);">
                    <i class="fas fa-file-alt"></i> <span>Reports</span>
                </a>
            </nav>
            <div style="margin-top: auto;">
                <button id="logoutBtn" class="btn"
                    style="width: 100%; justify-content: flex-start; color: var(--danger);">
                    <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header style="margin-bottom: 2.5rem;">
                <h1 style="font-size: 1.75rem;">Team Management</h1>
                <p style="color: var(--text-muted);">Manage employee roles and permissions</p>
            </header>

            <div class="glass-card" style="padding: 0; overflow: hidden;">
                <div
                    style="padding: 1.5rem; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="font-size: 1.125rem;">System Users</h3>
                    <div style="display: flex; gap: 0.75rem;">
                        <input type="text" id="userSearch" placeholder="Search by name or email..." class="form-input"
                            style="padding: 0.5rem 1rem; width: 300px;">
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr
                                style="background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--glass-border);">
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Name</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Email</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Current Role</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); text-align: right;">
                                    Action</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">

                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js" type="module"></script>
    <script type="module">
        import { app } from './assets/js/app.js';

        const admin = app.getSession();
        if (!admin || admin.role !== 'admin') window.location.href = 'index.html';
        document.getElementById('logoutBtn').onclick = () => app.logout();

        async function loadUsers() {

            const users = JSON.parse(localStorage.getItem('cd_users') || '[]');
            const tbody = document.getElementById('userTableBody');

            tbody.innerHTML = users.map(u => `
                <tr style="border-bottom: 1px solid var(--glass-border);">
                    <td style="padding: 1rem 1.5rem; font-weight: 600;">${u.name}</td>
                    <td style="padding: 1rem 1.5rem; color: var(--text-muted);">${u.email}</td>
                    <td style="padding: 1rem 1.5rem;">
                        <span class="badge" style="background: rgba(255,255,255,0.05); color: ${u.role === 'admin' ? 'var(--primary)' : 'var(--text-main)'}">
                            ${u.role.toUpperCase()}
                        </span>
                    </td>
                    <td style="padding: 1rem 1.5rem; text-align: right; display: flex; gap: 0.5rem; justify-content: flex-end;">
                        <select onchange="window.updateRole(${u.id}, this.value)" class="form-input" style="width: 130px; padding: 0.3rem 0.5rem; font-size: 0.8rem;">
                            <option value="user" ${u.role === 'user' ? 'selected' : ''}>User</option>
                            <option value="technician" ${u.role === 'technician' ? 'selected' : ''}>Technician</option>
                            <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                        </select>
                        ${u.email !== admin.email ? `
                            <button onclick="window.deleteUser(${u.id})" class="btn" style="background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 0.3rem 0.6rem;">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        ` : ''}
                    </td>
                </tr>
            `).join('');
        }

        window.updateRole = (userId, newRole) => {
            const users = JSON.parse(localStorage.getItem('cd_users'));
            const userIdx = users.findIndex(u => u.id === userId);
            if (userIdx !== -1) {
                users[userIdx].role = newRole;
                localStorage.setItem('cd_users', JSON.stringify(users));
                app.showToast(`Updated ${users[userIdx].name} to ${newRole}`, 'success');
                loadUsers();
            }
        };

        window.deleteUser = async (userId) => {
            const confirmed = await app.confirm(
                'Delete User Account?',
                'Are you sure you want to permanently delete this user? This action cannot be undone and will remove all their data.',
                'Delete Account'
            );

            if (confirmed) {
                const users = JSON.parse(localStorage.getItem('cd_users'));
                const filteredUsers = users.filter(u => u.id !== userId);
                localStorage.setItem('cd_users', JSON.stringify(filteredUsers));
                app.showToast('User deleted successfully', 'info');
                loadUsers();
            }
        };

        loadUsers();
    </script>
</body>

</html>
