<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudDesk | Ticket History</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="app-container">
        <aside class="sidebar">
            <a href="index.html"
                style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 3rem; cursor: pointer;">
                <div
                    style="width: 40px; height: 40px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-cloud"></i>
                </div>
                <span style="font-weight: 700; font-size: 1.25rem;">CloudDesk</span>
            </a>
            <nav style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
                <a href="user-dashboard.html" class="btn"
                    style="justify-content: flex-start; color: var(--text-muted);">
                    <i class="fas fa-th-large"></i> <span>Dashboard</span>
                </a>
                <a href="submit-ticket.html" class="btn" style="justify-content: flex-start; color: var(--text-muted);">
                    <i class="fas fa-plus-circle"></i> <span>New Ticket</span>
                </a>
                <a href="history.html" class="btn"
                    style="justify-content: flex-start; background: rgba(99, 102, 241, 0.1); color: var(--primary);">
                    <i class="fas fa-history"></i> <span>Ticket History</span>
                </a>
            </nav>
            <div style="margin-top: auto;">
                <button id="logoutBtn" class="btn"
                    style="width: 100%; justify-content: flex-start; color: var(--danger);">
                    <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header style="margin-bottom: 2.5rem;">
                <h1 style="font-size: 1.75rem;">Request History</h1>
                <p style="color: var(--text-muted);">Archive of your resolved and closed support tickets</p>
            </header>

            <div class="glass-card" style="padding: 0; overflow: hidden;">
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr
                                style="background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--glass-border);">
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Ticket ID</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Subject</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Status</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Resolved Date</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">

                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js" type="module"></script>
    <script type="module">
        import { app } from './assets/js/app.js';
        const user = app.getSession();
        if (!user) window.location.href = 'index.html';
        document.getElementById('logoutBtn').onclick = () => app.logout();

        async function loadHistory() {
            const tickets = await app.fetchTickets();
            const historyTickets = tickets.filter(t => t.status === 'resolved' || t.status === 'closed');
            const tbody = document.getElementById('historyTableBody');

            if (historyTickets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="padding: 3rem; text-align: center; color: var(--text-muted);">No archived tickets found.</td></tr>`;
            } else {
                tbody.innerHTML = historyTickets.map(t => `
                    <tr style="border-bottom: 1px solid var(--glass-border);">
                        <td style="padding: 1rem 1.5rem; font-family: monospace; color: var(--primary);">${t.id}</td>
                        <td style="padding: 1rem 1.5rem;">${t.title}</td>
                        <td style="padding: 1rem 1.5rem;"><span class="badge badge-${t.status}">${t.status}</span></td>
                        <td style="padding: 1rem 1.5rem; color: var(--text-muted);">${new Date(t.created_at || t.created).toLocaleDateString()}</td>
                    </tr>
                `).join('');
            }
        }
        loadHistory();
    </script>
</body>

</html>
