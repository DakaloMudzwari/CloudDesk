<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudDesk | Manage Ticket</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="app-container">
        <aside class="sidebar">
            <a href="#" onclick="app.goHome(); return false;"
                style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 3rem; cursor: pointer;">
                <div
                    style="width: 40px; height: 40px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-cloud"></i>
                </div>
                <span style="font-weight: 700; font-size: 1.25rem;">CloudDesk Admin</span>
            </a>
            <nav style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
                <a href="admin-dashboard.html" class="btn"
                    style="justify-content: flex-start; background: rgba(99, 102, 241, 0.1); color: var(--primary);">
                    <i class="fas fa-chart-line"></i> <span>Overview</span>
                </a>
                <a href="users.html" class="btn" style="justify-content: flex-start; color: var(--text-muted);">
                    <i class="fas fa-users-cog"></i> <span>User Management</span>
                </a>
                <a href="reports.html" class="btn" style="justify-content: flex-start; color: var(--text-muted);">
                    <i class="fas fa-file-alt"></i> <span>Reports</span>
                </a>
            </nav>
            <div style="margin-top: auto;">
                <button id="logoutBtn" class="btn"
                    style="width: 100%; justify-content: flex-start; color: var(--danger);">
                    <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header style="margin-bottom: 2.5rem;">
                <a href="admin-dashboard.html"
                    style="color: var(--primary); text-decoration: none; font-size: 0.875rem; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
                    <i class="fas fa-arrow-left"></i> Back to Queue
                </a>
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <div>
                        <h1 id="ticketId" style="font-size: 1.75rem; font-family: monospace; color: var(--primary);">
                            TKT-XXXX</h1>
                        <h2 id="ticketTitle" style="font-size: 1.25rem; margin-top: 0.25rem;">Issue Title Loading...
                        </h2>
                    </div>
                    <div id="ticketBadges">

                    </div>
                </div>
            </header>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">

                <div style="display: flex; flex-direction: column; gap: 2rem;">
                    <div class="glass-card">
                        <h3
                            style="font-size: 1rem; color: var(--text-muted); margin-bottom: 1rem; text-transform: uppercase;">
                            Description</h3>
                        <p id="ticketDesc" style="line-height: 1.6; color: var(--text-main);">Loading description...</p>
                    </div>

                    <div class="glass-card">
                        <h3
                            style="font-size: 1rem; color: var(--text-muted); margin-bottom: 1rem; text-transform: uppercase;">
                            Communication History</h3>
                        <div id="commentThread"
                            style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem;">

                        </div>
                        <div style="display: flex; gap: 1rem;">
                            <input type="text" id="newComment" class="form-input"
                                placeholder="Type a message to the requester...">
                            <button id="sendComment" class="btn btn-primary">Send</button>
                        </div>
                    </div>
                </div>

                <!-- Right: Actions -->
                <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div class="glass-card">
                        <h3
                            style="font-size: 1rem; color: var(--text-muted); margin-bottom: 1.5rem; text-transform: uppercase;">
                            Manage Status</h3>

                        <div class="form-group">
                            <label>Status</label>
                            <select id="statusSelect" class="form-input">
                                <option value="open">Open</option>
                                <option value="progress">In Progress</option>
                                <option value="resolved">Resolved</option>
                                <option value="closed">Closed</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Priority</label>
                            <select id="prioritySelect" class="form-input">
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                                <option value="Critical">Critical</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Assigned To</label>
                            <select id="assigneeSelect" class="form-input">
                                <option value="">Unassigned</option>
                                <option value="John Tech">John Tech</option>
                                <option value="Admin User">Admin User</option>
                            </select>
                        </div>

                        <button id="saveChanges" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                            Save Changes <i class="fas fa-save" style="margin-left: 0.5rem;"></i>
                        </button>
                    </div>

                    <div class="glass-card" style="border-color: rgba(239, 68, 68, 0.2);">
                        <h3
                            style="font-size: 0.875rem; color: var(--danger); margin-bottom: 1rem; text-transform: uppercase;">
                            Internal Notes</h3>
                        <textarea class="form-input" style="font-size: 0.875rem;" rows="4"
                            placeholder="Private notes for IT staff..."></textarea>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js" type="module"></script>
    <script type="module">
        import { app } from './assets/js/app.js';

        const admin = app.getSession();
        if (!admin || admin.role === 'user') window.location.href = 'index.html';
        document.getElementById('logoutBtn').onclick = () => app.logout();

        const urlParams = new URLSearchParams(window.location.search);
        const ticketId = urlParams.get('id');

        async function loadTicket() {
            const tickets = await app.fetchTickets();
            const ticket = tickets.find(t => t.id === ticketId);

            if (!ticket) {
                app.showToast('Ticket not found!', 'danger');
                return;
            }

            document.getElementById('ticketId').textContent = ticket.id;
            document.getElementById('ticketTitle').textContent = ticket.title;
            document.getElementById('ticketDesc').textContent = ticket.description || ticket.desc;
            document.getElementById('statusSelect').value = ticket.status;
            document.getElementById('prioritySelect').value = ticket.priority;
            document.getElementById('assigneeSelect').value = ticket.assignee || '';

            document.getElementById('ticketBadges').innerHTML = `
                <span class="badge badge-${ticket.status}">${ticket.status}</span>
            `;
            
            loadComments();
        }

        async function loadComments() {
            try {
                const response = await fetch(`api/comments.php?ticket_id=${ticketId}`);
                const comments = await response.json();
                const thread = document.getElementById('commentThread');
                thread.innerHTML = '';
                
                comments.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'glass-card';
                    div.style.padding = '1rem';
                    div.style.marginBottom = '0.5rem';
                    div.innerHTML = `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span style="font-weight: 600;">${c.user_name}</span>
                            <span style="color: var(--text-muted); font-size: 0.875rem;">${new Date(c.created_at).toLocaleString()}</span>
                        </div>
                        <div>${c.content}</div>
                    `;
                    thread.appendChild(div);
                });
            } catch (err) {
                console.error('Failed to load comments', err);
            }
        }

        document.getElementById('sendComment').onclick = async () => {
            const content = document.getElementById('newComment').value;
            if (!content) return;

            try {
                const response = await fetch('api/comments.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ticket_id: ticketId,
                        user_id: admin.id,
                        content: content
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    document.getElementById('newComment').value = '';
                    loadComments();
                } else {
                    app.showToast(result.error || 'Failed to send comment', 'danger');
                }
            } catch (err) {
                app.showToast('Failed to connect to server', 'danger');
            }
        };

        document.getElementById('saveChanges').onclick = async () => {
            const updatedData = {
                id: ticketId,
                status: document.getElementById('statusSelect').value,
                priority: document.getElementById('prioritySelect').value,
                assignee: document.getElementById('assigneeSelect').value
            };

            try {
                const response = await fetch('api/tickets.php', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    app.showToast('Changes saved successfully!', 'success');
                    loadTicket();
                } else {
                    app.showToast(result.error || 'Failed to save changes', 'danger');
                }
            } catch (err) {
                app.showToast('Failed to connect to server', 'danger');
                console.error(err);
            }
        };

        loadTicket();
    </script>
</body>

</html>
