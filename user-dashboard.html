<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudDesk | User Dashboard</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="app-container">

        <aside class="sidebar">
            <a href="index.html"
                style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 3rem; cursor: pointer;">
                <div
                    style="width: 40px; height: 40px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem;">
                    <i class="fas fa-cloud"></i>
                </div>
                <span style="font-weight: 700; font-size: 1.25rem; letter-spacing: -0.5px;">CloudDesk</span>
            </a>

            <nav style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
                <a href="user-dashboard.html" class="btn"
                    style="justify-content: flex-start; background: rgba(99, 102, 241, 0.1); color: var(--primary);">
                    <i class="fas fa-th-large"></i> <span>Dashboard</span>
                </a>
                <a href="submit-ticket.html" class="btn" style="justify-content: flex-start; color: var(--text-muted);">
                    <i class="fas fa-plus-circle"></i> <span>New Ticket</span>
                </a>
                <a href="history.html" class="btn" style="justify-content: flex-start; color: var(--text-muted);">
                    <i class="fas fa-history"></i> <span>Ticket History</span>
                </a>
            </nav>

            <div style="margin-top: auto; border-top: 1px solid var(--glass-border); padding-top: 1.5rem;">
                <div id="userProfile" style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
                    <div
                        style="width: 32px; height: 32px; background: var(--secondary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;">
                        JD</div>
                    <div>
                        <p id="userName" style="font-size: 0.875rem; font-weight: 600;">Jane Doe</p>
                        <p style="font-size: 0.75rem; color: var(--text-muted);">Standard User</p>
                    </div>
                </div>
                <button id="logoutBtn" class="btn"
                    style="width: 100%; justify-content: flex-start; background: transparent; color: var(--danger); padding: 0.5rem 0;">
                    <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
                </button>
            </div>
        </aside>


        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem;">
                <div>
                    <h1 style="font-size: 1.75rem; margin-bottom: 0.25rem;">My Support Desk</h1>
                    <p style="color: var(--text-muted);">Track and manage your requests</p>
                </div>
                <a href="submit-ticket.html" class="btn btn-primary">
                    <i class="fas fa-plus"></i> New Request
                </a>
            </header>


            <div
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem;">
                <div class="glass-card" style="padding: 1.5rem; text-align: center;">
                    <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 0.5rem;">Total Tickets</p>
                    <h2 id="statTotal" style="font-size: 2rem;">2</h2>
                </div>
                <div class="glass-card"
                    style="padding: 1.5rem; text-align: center; border-bottom: 3px solid var(--info);">
                    <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 0.5rem;">Open</p>
                    <h2 id="statOpen" style="font-size: 2rem; color: var(--info);">1</h2>
                </div>
                <div class="glass-card"
                    style="padding: 1.5rem; text-align: center; border-bottom: 3px solid var(--success);">
                    <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 0.5rem;">Resolved</p>
                    <h2 id="statResolved" style="font-size: 2rem; color: var(--success);">0</h2>
                </div>
            </div>


            <div class="glass-card" style="padding: 0; overflow: hidden;">
                <div
                    style="padding: 1.5rem; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="font-size: 1.125rem;">Recent Requests</h3>
                    <div style="display: flex; gap: 0.75rem;">
                        <input type="text" placeholder="Search tickets..." class="form-input"
                            style="padding: 0.5rem 1rem; width: 250px; font-size: 0.875rem;">
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr
                                style="background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--glass-border);">
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Ticket ID</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Subject</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Category</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Priority</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Status</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    SLA Status</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Created</th>
                            </tr>
                        </thead>
                        <tbody id="ticketTableBody">

                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js" type="module"></script>
    <script type="module">
        import { app } from './assets/js/app.js';


        const user = app.getSession();
        if (!user || user.role !== 'user') window.location.href = 'index.html';


        document.getElementById('userName').textContent = user.name;
        document.getElementById('logoutBtn').onclick = () => app.logout();


        async function loadTickets() {
            const tickets = await app.fetchTickets();
            const tbody = document.getElementById('ticketTableBody');

            document.getElementById('statTotal').textContent = tickets.length;
            document.getElementById('statOpen').textContent = tickets.filter(t => t.status === 'open' || t.status === 'progress').length;
            document.getElementById('statResolved').textContent = tickets.filter(t => t.status === 'resolved').length;

            if (tickets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="padding: 3rem; text-align: center; color: var(--text-muted);">No tickets found. Create your first one!</td></tr>`;
            } else {
                tbody.innerHTML = tickets.map(t => `
                    <tr style="border-bottom: 1px solid var(--glass-border); transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.02)'" onmouseout="this.style.background='transparent'">
                        <td style="padding: 1rem 1.5rem; font-family: monospace; color: var(--primary); font-weight: 600;">${t.id}</td>
                        <td style="padding: 1rem 1.5rem; font-weight: 500;">${t.title}</td>
                        <td style="padding: 1rem 1.5rem;">${t.category}</td>
                        <td style="padding: 1rem 1.5rem;">
                            <span style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem;">
                                <div style="width: 8px; height: 8px; border-radius: 50%; background: ${t.priority === 'High' ? 'var(--danger)' : t.priority === 'Medium' ? 'var(--warning)' : 'var(--success)'}"></div>
                                ${t.priority}
                            </span>
                        </td>
                        <td style="padding: 1rem 1.5rem;">
                            <span class="badge badge-${t.status}">${t.status}</span>
                        </td>
                        <td style="padding: 1rem 1.5rem;">
                            <span style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem;">
                                <div style="width: 8px; height: 8px; border-radius: 50%; background: ${t.sla_status === 'breached' ? 'var(--danger)' : t.sla_status === 'warning' ? 'var(--warning)' : 'var(--success)'}"></div>
                                ${t.sla_status || 'on-track'}
                            </span>
                        </td>
                        <td style="padding: 1rem 1.5rem; font-size: 0.875rem; color: var(--text-muted);">${new Date(t.created_at || t.created).toLocaleDateString()}</td>
                    </tr>
                `).join('');
            }
        }

        loadTickets();
    </script>
</body>

</html>
