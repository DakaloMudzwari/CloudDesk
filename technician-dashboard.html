<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudDesk | Technician Panel</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="app-container">
        <aside class="sidebar">
            <a href="#" onclick="app.goHome(); return false;"
                style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 3rem; cursor: pointer;">
                <div
                    style="width: 40px; height: 40px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-cloud"></i>
                </div>
                <span style="font-weight: 700; font-size: 1.25rem;">CloudDesk Tech</span>
            </a>
            <nav style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
                <a href="technician-dashboard.html" class="btn"
                    style="justify-content: flex-start; background: rgba(99, 102, 241, 0.1); color: var(--primary);">
                    <i class="fas fa-chart-line"></i> <span>Overview</span>
                </a>
            </nav>
            <div style="margin-top: auto;">
                <button id="logoutBtn" class="btn"
                    style="width: 100%; justify-content: flex-start; color: var(--danger);">
                    <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem;">
                <div>
                    <h1 style="font-size: 1.75rem;">Support Queue</h1>
                    <p style="color: var(--text-muted);">Manage incoming requests and assignments</p>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="glass-card"
                        style="padding: 0.5rem 1rem; display: flex; align-items: center; gap: 1rem; border-radius: var(--radius-md);">
                        <span style="font-size: 0.875rem; color: var(--text-muted);">System Status:</span>
                        <span style="color: var(--success); font-size: 0.875rem; font-weight: 600;">● Healthy</span>
                    </div>
                </div>
            </header>

            <!-- Stats -->
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-bottom: 2.5rem;">
                <div class="glass-card" style="padding: 1.25rem;">
                    <p
                        style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.5rem;">
                        Unassigned</p>
                    <h2 id="statUnassigned" style="font-size: 1.75rem; color: var(--danger);">1</h2>
                </div>
                <div class="glass-card" style="padding: 1.25rem;">
                    <p
                        style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.5rem;">
                        In Progress</p>
                    <h2 id="statProgress" style="font-size: 1.75rem; color: var(--warning);">1</h2>
                </div>
                <div class="glass-card" style="padding: 1.25rem;">
                    <p
                        style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.5rem;">
                        Avg Response</p>
                    <h2 style="font-size: 1.75rem;">14m</h2>
                </div>
                <div class="glass-card" style="padding: 1.25rem;">
                    <p
                        style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.5rem;">
                        SLA Met</p>
                    <h2 style="font-size: 1.75rem; color: var(--success);">98%</h2>
                </div>
            </div>


            <div class="glass-card" style="padding: 0;">
                <div
                    style="padding: 1.5rem; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="font-size: 1.125rem;">Global Ticket Queue</h3>
                    <div style="display: flex; gap: 1rem;">
                        <select class="form-input" style="padding: 0.5rem 1rem; width: 150px; font-size: 0.875rem;">
                            <option>All Status</option>
                            <option>Open</option>
                            <option>In Progress</option>
                            <option>Resolved</option>
                        </select>
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr
                                style="background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--glass-border);">
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Ticket ID</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Subject</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Requester</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Priority</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Assignee</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Status</th>
                                <th
                                    style="padding: 1rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    SLA</th>
                                <th
                                    style="padding: 1rem 1.5rem; text-align: right; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">
                                    Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminTicketBody">

                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js" type="module"></script>
    <script type="module">
        import { app } from './assets/js/app.js';

        const admin = app.getSession();
        if (!admin || admin.role !== 'technician') {
            window.location.href = 'index.html';
        }

        document.getElementById('logoutBtn').onclick = () => app.logout();

        async function renderTickets() {
            const tickets = await app.fetchTickets();
            const users = JSON.parse(localStorage.getItem('cd_users') || '[]');
            const tbody = document.getElementById('adminTicketBody');

            document.getElementById('statUnassigned').textContent = tickets.filter(t => !t.assignee && t.status === 'open').length;
            document.getElementById('statProgress').textContent = tickets.filter(t => t.status === 'progress').length;

            tbody.innerHTML = tickets.map(t => {
                const requesterName = t.requester_name || (users.find(u => u.id === t.userId)?.name) || 'Unknown';
                return `
                    <tr style="border-bottom: 1px solid var(--glass-border);">
                        <td style="padding: 1rem 1.5rem;">
                            <div style="font-weight: 600; color: var(--primary);">${t.id}</div>
                        </td>
                        <td style="padding: 1rem 1.5rem;">
                            <div style="font-size: 0.875rem; color: white;">${t.title}</div>
                        </td>
                        <td style="padding: 1rem 1.5rem;">
                            <div style="font-size: 0.875rem;">${requesterName}</div>
                        </td>
                        <td style="padding: 1rem 1.5rem;">
                             <span style="font-size: 0.875rem; color: ${t.priority === 'High' ? 'var(--danger)' : 'inherit'}">
                                ${t.priority}
                             </span>
                        </td>
                        <td style="padding: 1rem 1.5rem;">
                            <div style="font-size: 0.875rem; color: var(--text-muted); italic">${t.assignee || 'Unassigned'}</div>
                        </td>
                        <td style="padding: 1rem 1.5rem;">
                            <span class="badge badge-${t.status}">${t.status}</span>
                        </td>
                        <td style="padding: 1rem 1.5rem;">
                            <span style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem;">
                                <div style="width: 8px; height: 8px; border-radius: 50%; background: ${t.sla_status === 'breached' ? 'var(--danger)' : t.sla_status === 'warning' ? 'var(--warning)' : 'var(--success)'}"></div>
                                ${t.sla_status || 'on-track'}
                            </span>
                        </td>
                        <td style="padding: 1rem 1.5rem; text-align: right;">
                            <button onclick="window.manageTicket('${t.id}')" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.75rem; background: rgba(255,255,255,0.05);">Manage</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.manageTicket = (id) => {
            window.location.href = `manage-ticket.html?id=${id}`;
        };

        renderTickets();
    </script>
</body>

</html>
